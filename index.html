<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hemmings | Design Versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4ED;color:#252923;font-family:'Jost',sans-serif;font-weight:300;padding:40px 20px}
main{width:min(100%,880px)}
p.k{margin:0 0 14px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#6E5B2E}
h1{margin:0 0 44px;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(44px,8vw,92px);line-height:1}
h1 em{font-style:italic}
ul{list-style:none;margin:0;padding:0;border-top:1px solid #D9D0BD}
a{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;padding:26px 4px;border-bottom:1px solid #D9D0BD;color:inherit;text-decoration:none;transition:padding .4s,background .4s}
a:hover,a:focus-visible{padding-left:18px;background:#E8E0CF;outline:0}
a strong{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,4vw,42px)}
a span{font-size:16px;color:#555A50}
</style>
</head>
<body>
<main>
  <p class="k">Hemmings</p>
  <h1>Design <em>Versions</em></h1>
  <ul>
    <li><a href="v1/"><strong>Version 1</strong><span>Editorial layout, five palettes</span></a></li>
    <li><a href="v2/"><strong>Version 2</strong><span>Maison layout, five palettes</span></a></li>
    <li><a href="v3/"><strong>Version 3</strong><span>Atelier layout, five palettes</span></a></li>
    <li><a href="v4/"><strong>Version 4</strong><span>Storefront layout, five palettes, floating silk</span></a></li>
    <li><a href="v5/"><strong>Version 5</strong><span>Storefront layout with scroll, hover and parallax effects</span></a></li>
  </ul>
</main>
</body>
</html>
