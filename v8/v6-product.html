<!doctype html>
<html lang="en" data-v="6">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product | Hemmings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap">
<link rel="stylesheet" href="v6-shared.css">
<link rel="stylesheet" href="hm-pages.css">
<script src="lock.js"></script>
<script>(function(){var d=document.documentElement;d.classList.add('js');try{var p=window.HM_LOCK||localStorage.getItem('hemmings.palette');if(p&&p!=='forest')d.setAttribute('data-palette',p)}catch(e){}})();</script>
<style>
.pd-top { padding-block: 24px; }
.pd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(30px, 5vw, 90px); align-items: start; padding-bottom: clamp(80px, 10vw, 150px); }
#gal { display: grid; grid-template-columns: 84px 1fr; gap: 14px; position: sticky; top: 140px; }
#gal .main { grid-column: 2; grid-row: 1; aspect-ratio: 4 / 5; }
#gal .thumbs { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 10px; }
#gal .thumbs button { aspect-ratio: 4 / 5; border: 0; padding: 0; opacity: .55; outline: 1px solid transparent; outline-offset: 3px; transition: opacity .3s, outline-color .3s; cursor: pointer; }
#gal .thumbs button[aria-pressed="true"] { opacity: 1; outline-color: var(--deep); }
#info h1 { font-size: clamp(32px, 3.4vw, 52px); }
.look { background: var(--white); padding-block: clamp(70px, 9vw, 140px); }
#look { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 2.6vw, 44px); }
#look .lrow { display: block; border: 0; padding: 0; }
#look .lrow .pic { aspect-ratio: 4 / 5; margin-bottom: 16px; }
.also { padding-block: clamp(70px, 9vw, 140px); }
@media (max-width: 900px) {
  .pd { grid-template-columns: minmax(0, 1fr); }
  #gal { position: static; grid-template-columns: minmax(0, 1fr); }
  #gal .main, #gal .thumbs { grid-column: 1; grid-row: auto; }
  #gal .thumbs { flex-direction: row; }
  #gal .thumbs button { width: 72px; }
  #look { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="hm-top"></div>
<main>
  <div class="pd-top wrap"><nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav></div>
  <section class="pd wrap">
    <div id="gal"></div>
    <div id="info"></div>
  </section>
  <section class="look">
    <div class="wrap">
      <div class="sec-h"><h2 class="h">Complete the <em>Look</em></h2><span class="lab m">Pair it with</span></div>
      <div id="look"></div>
    </div>
  </section>
  <section class="also wrap">
    <div class="sec-h"><h2 class="h">You May Also <em>Like</em></h2><a class="go" href="v6-bedding.html">Shop all bedding</a></div>
    <div class="pg four" id="also"></div>
  </section>
</main>
<div id="hm-foot"></div>
<script src="hm.js"></script>
<script>HM.product();</script>
</body>
</html>
