<!doctype html>
<html lang="en" data-v="2" data-dept="bath">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bath | Hemmings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Libre+Caslon+Display&family=Tenor+Sans&family=Jost:wght@300;400&display=swap">
<link rel="stylesheet" href="v2-shared.css">
<link rel="stylesheet" href="hm-pages.css">
<script src="lock.js"></script>
<script>(function(){var d=document.documentElement;d.classList.add('js');try{var p=window.HM_LOCK||localStorage.getItem('hemmings.palette');if(p&&p!=='forest')d.setAttribute('data-palette',p)}catch(e){}})();</script>
<style>
.lh { position: relative; min-height: clamp(440px, 66vh, 680px); display: grid; place-items: center; text-align: center; overflow: hidden; }
.lh .bg { position: absolute; inset: 0; }
.lh .bg img { width: 100%; height: 100%; object-fit: cover; animation: settle 3.5s var(--ease) both; }
.lh .bg::after { content: ""; position: absolute; inset: 0; background: var(--deep); mix-blend-mode: color; opacity: .7; }
.lh::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(var(--shade), .5), rgba(var(--shade), .86)); }
.lh .frame { position: absolute; z-index: 1; inset: 108px 22px 22px; border: 1px solid color-mix(in srgb, var(--metal-soft) 42%, transparent); }
.lh-in { position: relative; z-index: 2; padding-top: 110px; padding-bottom: 50px; display: grid; gap: 18px; justify-items: center; }
.lh .crumb { color: var(--on-deep-2); }
.lh .crumb a:hover { color: var(--white); }
.lh h1 { font-size: clamp(72px, 14vw, 240px); font-style: italic; line-height: .86; }
.lh p { margin: 0; max-width: 44ch; color: var(--on-deep-2); }
@keyframes settle { from { transform: scale(1.14); } }
.fbar { position: sticky; top: 74px; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--line); transition: background-color .8s; }
.fbar-in { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 68px; }
.fbar .right { display: flex; align-items: center; gap: 22px; flex: none; }
.fbar .ft-btn { min-height: 48px; border: 0; background: none; font-family: var(--label); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
#count { color: var(--muted); font-size: 14px; white-space: nowrap; }
#filters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(20px, 3vw, 56px); padding-block: 34px 40px; border-top: 1px solid var(--line); }
.list { padding-block: clamp(50px, 6vw, 100px) clamp(90px, 11vw, 170px); }
.promo-tile { grid-column: span 2; position: relative; min-height: 420px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 16px; padding: clamp(24px, 3.4vw, 56px); overflow: hidden; background: var(--deep); color: var(--on-deep); }
.promo-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.promo-tile > * { position: relative; }
.promo-tile .h { font-size: clamp(38px, 4.6vw, 76px); }
.promo-tile .lab { color: var(--metal-soft); }
@media (max-width: 900px) {
  #filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fbar-in { flex-wrap: wrap; gap: 0 20px; padding-block: 4px; }
  .fbar .right { width: 100%; justify-content: space-between; }
  .promo-tile { grid-column: 1 / -1; min-height: 340px; }
  .lh .frame { inset: 90px 14px 14px; }
}
</style>
</head>
<body>
<div id="hm-top"></div>
<main>
  <section class="lh dark">
    <div class="bg"><img id="deptImg" src="img/r_towels.jpg" alt=""></div>
    <div class="frame"></div>
    <div class="lh-in wrap">
      <nav class="crumb" aria-label="Breadcrumb"><a href="v2.html">Home</a><span>/</span><span id="deptCrumb">Bath</span></nav>
      <h1 class="h" id="deptTitle">Bath</h1>
      <p id="deptDesc"></p>
    </div>
  </section>

  <div class="fbar">
    <div class="fbar-in wrap">
      <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
      <div class="right">
        <span id="count"></span>
        <button type="button" class="ft-btn" data-ftoggle aria-expanded="false" aria-controls="filters"><i class="loz"></i>Filters<span id="fN"></span></button>
        <label class="sr" for="sort">Sort by</label>
        <select id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option></select>
      </div>
    </div>
    <div class="wrap"><div id="filters" hidden></div></div>
  </div>

  <section class="list wrap"><div class="pg" id="grid"></div></section>
  <template id="promo"><a class="promo-tile" href="v2.html#designer"><img data-pal="mid" src="img/m_emerald.jpg" alt=""><span class="lab">The Hemmings Bed Designer</span><span class="h">Your Bed.<br><em>Your Composition.</em></span><span class="go">Design Your Bed <i>&rarr;</i></span></a></template>
</main>
<div id="hm-foot"></div>
<script src="hm.js"></script>
<script>HM.listing(); HM.setPalette(document.documentElement.getAttribute('data-palette') || 'forest');</script>
</body>
</html>
