<!doctype html>
<html lang="en" data-v="4" data-dept="bath">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bath | Hemmings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Figtree:wght@300..600&display=swap">
<link rel="stylesheet" href="v4-shared.css">
<link rel="stylesheet" href="hm-pages.css">
<script src="lock.js"></script>
<script>(function(){var d=document.documentElement;d.classList.add('js');try{var p=window.HM_LOCK||localStorage.getItem('hemmings.palette');if(p&&p!=='forest')d.setAttribute('data-palette',p)}catch(e){}})();</script>
<style>
.banner { display: grid; grid-template-columns: 5fr 7fr; min-height: clamp(360px, 52vh, 540px); background: var(--sand); transition: background-color .8s; }
.banner-copy { display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding-block: clamp(30px, 5vw, 70px); }
.banner h1 { font-size: clamp(54px, 8vw, 132px); text-transform: uppercase; color: var(--deep); line-height: .94; }
.banner p { margin: 0; max-width: 40ch; color: var(--muted); }
.banner .pic { height: 100%; min-height: 260px; }
.banner .pic img { animation: settle 3s var(--ease) both; }
@keyframes settle { from { transform: scale(1.12); } }
.shop { display: grid; grid-template-columns: 250px 1fr; gap: clamp(30px, 4.4vw, 76px); align-items: start; padding-block: clamp(40px, 5vw, 80px) clamp(90px, 11vw, 170px); }
.side { position: sticky; top: 140px; }
.side .tabs { flex-direction: column; gap: 0; padding-bottom: 22px; }
.side .tabs button { min-height: 40px; text-align: left; font-size: 15px; letter-spacing: 0; text-transform: none; border-bottom: 0; }
.side .tabs button[aria-pressed="true"] { font-weight: 500; }
#filters { display: flex; flex-direction: column; }
#filters .fg { padding-block: 22px; border-top: 1px solid var(--line); }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
#count { color: var(--muted); }
.toolbar label { display: flex; align-items: center; gap: 12px; font-size: 15px; }
@media (max-width: 900px) {
  .banner, .shop { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .side .tabs { flex-direction: row; gap: 22px; }
  #filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
}
</style>
</head>
<body>
<div id="hm-top"></div>
<main>
  <section class="banner">
    <div class="banner-copy wrap">
      <nav class="crumb" aria-label="Breadcrumb"><a href="v2.html">Home</a><span>/</span><span id="deptCrumb">Bath</span></nav>
      <h1 class="h" id="deptTitle">Bath</h1>
      <p id="deptDesc"></p>
    </div>
    <div class="pic"><img id="deptImg" src="img/r_towels.jpg" alt=""></div>
  </section>

  <section class="shop wrap">
    <aside class="side" aria-label="Filters">
      <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
      <div id="filters"></div>
    </aside>
    <div>
      <div class="toolbar"><span id="count"></span><label for="sort">Sort by<select id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option></select></label></div>
      <div class="pg" id="grid"></div>
    </div>
  </section>
</main>
<div id="hm-foot"></div>
<script src="hm.js"></script>
<script>HM.listing();</script>
</body>
</html>
