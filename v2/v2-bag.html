<!doctype html>
<html lang="en" data-v="2">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Bag | Hemmings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Libre+Caslon+Display&family=Tenor+Sans&family=Jost:wght@300;400&display=swap">
<link rel="stylesheet" href="v2-shared.css">
<link rel="stylesheet" href="hm-pages.css">
<script src="lock.js"></script>
<script>(function(){var d=document.documentElement;d.classList.add('js');try{var p=window.HM_LOCK||localStorage.getItem('hemmings.palette');if(p&&p!=='forest')d.setAttribute('data-palette',p)}catch(e){}})();</script>
<style>
main { padding-top: calc(74px + env(safe-area-inset-top, 0px)); min-height: 80vh; }
.bg-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 30px; padding-block: clamp(50px, 7vw, 110px) clamp(30px, 4vw, 60px); border-bottom: 1px solid var(--line); }
.bg-head .h { font-size: clamp(60px, 10vw, 170px); color: var(--deep); line-height: .9; }
.bg-head .meta { display: flex; align-items: center; gap: 30px; color: var(--muted); }
.bgrid { display: grid; grid-template-columns: 8fr 4fr; gap: clamp(30px, 6vw, 110px); align-items: start; padding-bottom: clamp(90px, 11vw, 170px); }
#summary { position: sticky; top: 110px; margin: clamp(30px, 4vw, 60px) 12px 12px; padding: clamp(24px, 2.6vw, 40px); background: var(--white); }
#summary::after { content: ""; position: absolute; inset: -12px; border: 1px solid color-mix(in srgb, var(--metal) 55%, transparent); pointer-events: none; }
.back { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 30px; min-height: 58px; padding: 0 20px; border: 1px solid color-mix(in srgb, var(--metal) 60%, transparent); color: var(--deep); font-size: 15px; }
@media (max-width: 900px) { .bgrid { grid-template-columns: minmax(0, 1fr); } #summary { position: relative; top: 0; } }
</style>
</head>
<body class="plain">
<div id="hm-top"></div>
<main>
  <div class="wrap">
    <div class="bg-head"><h1 class="h">Your <em>Bag</em></h1><div class="meta"><span id="bagCount"></span><a class="go" href="v2-bedding.html">Continue shopping <i>&rarr;</i></a></div></div>
    <div class="bgrid">
      <div><div id="lines"></div><a class="back" href="designer/index.html#v2"><span>Compose a whole bed in the Bed Designer</span><span aria-hidden="true">&rarr;</span></a></div>
      <aside id="summary" aria-label="Order summary"></aside>
    </div>
  </div>
</main>
<div id="hm-foot"></div>
<script src="hm.js"></script>
<script>HM.bagPage();</script>
</body>
</html>
