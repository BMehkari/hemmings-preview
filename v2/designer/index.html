<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bed Designer | Hemmings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Libre+Caslon+Display&family=Jost:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="designer.css">
<!-- The designer is shared by both site versions: #v1 or #v2 in the address picks the look and where "back" leads. -->
<script src="../lock.js"></script>
<script>(function(){var d=document.documentElement,v='1',p='';try{v=sessionStorage.getItem('hemmings.designer.v')||v;p=window.HM_LOCK||localStorage.getItem('hemmings.palette')||''}catch(e){}if(/^#v[123]$/.test(location.hash))v=location.hash.slice(2);try{sessionStorage.setItem('hemmings.designer.v',v)}catch(e){}d.setAttribute('data-v',v);if(p&&p!=='forest')d.setAttribute('data-palette',p)})();</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<header class="bar">
  <a class="brand" id="homeLink" href="../index.html" aria-label="Back to Hemmings">HEMMINGS</a>
  <span class="bar-title">The Bed Designer</span>
  <a class="bag-link" id="bagLink" href="../v1-bag.html">Bag <span id="bagCount">0</span></a>
</header>

<main class="app">
  <aside class="panel" aria-label="Choose your pieces">
    <div class="panel-head">
      <h1>Your Bed. Your Composition.</h1>
      <p>Layer textures, tones and pieces. Everything you add appears on the bed.</p>
      <form class="filters" id="filters" aria-label="Filter pieces">
        <label>Colour<select name="family"><option value="">All</option><option value="neutral">Neutrals</option><option value="green">Greens</option><option value="earth">Earth</option><option value="blue">Blues</option><option value="dark">Dark</option></select></label>
        <label>Material<select name="material"><option value="">All</option></select></label>
        <label>Collection<select name="collection"><option value="">All</option></select></label>
        <label>Price<select name="price"><option value="">Any</option><option value="3000">Under Rs. 3,000</option><option value="8000">Under Rs. 8,000</option><option value="15000">Under Rs. 15,000</option></select></label>
      </form>
    </div>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <div class="cats" id="cats"></div>
  </aside>

  <section class="stage" aria-label="Your bed">
    <div class="tools" id="tools"></div>
    <div class="viewport" id="viewport">
      <svg id="bed" viewBox="70 120 1060 660" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Preview of your bed composition"></svg>
    </div>
    <div class="dock" id="dock"></div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
